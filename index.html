
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맹구 & 콩콩 오사카·아리마 맛집</title>
<meta name="theme-color" content="#fff9f6">
<style>
:root {
  --bg:#fff9f6; --card:#fff; --text:#201b18; --muted:#786e67; --line:#efe3db;
  --soft:#f8f0eb; --chip:#fff0f3; --chiptext:#a63b56; --accent:#211d1a;
  --shadow:0 12px 36px rgba(70,44,31,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}
button,input{font:inherit}
.app{max-width:1480px;margin:auto;display:grid;grid-template-columns:minmax(560px,1fr) 500px;gap:18px;padding:16px}
.left{min-width:0}
.hero{background:linear-gradient(135deg,#fff,#fff2ea);border:1px solid var(--line);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:29px;letter-spacing:-.045em}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.statrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px;color:#5f5650}
.controls{position:sticky;top:0;z-index:10;background:rgba(255,249,246,.92);backdrop-filter:blur(12px);padding:12px 0 8px}
.search{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;outline:none;font-size:15px}
.tabs{display:flex;gap:8px;overflow:auto;padding-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:13px;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;padding:8px 2px 10px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 3px 14px rgba(65,39,27,.04);transition:.15s}
.card:hover{transform:translateY(-1px)}
.card.selected{border-color:#cfb8ac;box-shadow:0 0 0 2px #f4e7df}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-size:17px;font-weight:850;line-height:1.35;letter-spacing:-.02em;cursor:pointer;text-decoration:underline;text-decoration-color:#e1d4cb;text-underline-offset:4px}
.score{font-size:14px;font-weight:850;white-space:nowrap}
.tags{margin-top:7px}
.cat{display:inline-block;background:var(--chip);color:var(--chiptext);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}
.area{font-size:11px;color:var(--muted);margin-left:6px}
.summary{font-size:13px;color:#4d4540;line-height:1.55;margin:11px 0 12px;min-height:40px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{border:0;border-radius:11px;padding:10px 8px;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.detailbtn{background:var(--soft);color:#483c35}
.mapbtn{background:var(--accent);color:#fff}
.rightwrap{position:relative}
.panel{position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.banner{height:190px;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.95) 0 7%,transparent 8%),linear-gradient(135deg,#f8e9de,#eee1d6 55%,#e0d6cf);display:flex;align-items:flex-end}
.bannerbox{margin:18px;background:rgba(255,255,255,.92);padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.8);display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(65,39,27,.08)}
.pin{font-size:24px}
.bannerarea{font-size:12px;color:#6d625b;font-weight:700}
.bannercat{font-size:15px;font-weight:850;margin-top:2px}
.body{padding:20px}
.title{font-size:26px;font-weight:900;line-height:1.25;letter-spacing:-.045em;margin:0 0 6px}
.submeta{font-size:13px;color:#4c4440;line-height:1.5}
.submeta b{color:#171310}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.quick a{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:10px 8px;text-align:center;font-size:12px;font-weight:850;color:#2a2522;background:#fff}
.quick a:first-child{background:var(--accent);color:#fff;border-color:var(--accent)}
.section{padding:16px 0;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:17px;letter-spacing:-.02em}
.section p{margin:0;color:#48403b;font-size:13.5px;line-height:1.75}
.menu{display:grid;gap:7px}
.menuitem{display:flex;justify-content:space-between;gap:12px;background:#fffaf7;border:1px solid #f1e7e0;padding:10px 11px;border-radius:12px;font-size:13px}
.menuitem span:first-child{font-weight:750}
.tiprow{display:flex;flex-wrap:wrap;gap:8px}
.tipchip{background:#fff7d9;color:#7a5a00;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700}
.foot{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.5}
.closemobile{display:none;position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.95);font-size:22px;box-shadow:0 2px 9px rgba(0,0,0,.13)}
.backdrop{display:none}
@media(max-width:980px){
  .app{display:block;padding:12px}
  .grid{grid-template-columns:1fr}
  .panel{position:fixed;z-index:101;inset:0 0 0 auto;width:min(520px,100%);height:100dvh;border-radius:0;transform:translateX(102%);transition:transform .22s ease;top:0}
  .panel.open{transform:translateX(0)}
  .banner{height:180px}
  .closemobile{display:block}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(19,14,11,.45);opacity:0;pointer-events:none;transition:.2s;z-index:100}
  .backdrop.show{opacity:1;pointer-events:auto}
}
@media(min-width:981px) and (max-width:1180px){
  .app{grid-template-columns:minmax(480px,1fr) 420px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <section class="left">

</div>
<div id="backdrop" class="backdrop"></div>

  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function renderTabs(){
  tabs.innerHTML = tabsOrder.map(t => `<button class="tab ${t===filter?'active':''}" data-tab="${esc(t)}">${esc(t)}</button>`).join("");
  tabs.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      filter = btn.dataset.tab;
      renderList();
    };
  });
}
function showDetail(index, mobileOpen=true){
  currentIndex = index;
  const p = places[index];
  const menusHtml = p.menus.map(m => `<div class="menuitem"><span>${esc(m)}</span><span>추천</span></div>`).join("");
  const tipsHtml = p.tips.map(t => `<span class="tipchip">${esc(t)}</span>`).join("");
  detail.innerHTML = `
    <div class="banner">
      <div class="bannerbox">
        <div class="pin">📍</div>
        <div>
          <div class="bannerarea">${esc(p.area)}</div>
          <div class="bannercat">${esc(p.category)}</div>
        </div>
      </div>
    </div>
    <div class="body">
      <h2 class="title">${esc(p.name)}</h2>
      <div class="submeta">⭐ <b>${Number(p.rating).toFixed(1)}</b> · ${esc(p.category)} · ${esc(p.area)}</div>
      <div class="quick">
        <a href="${mapsUrl(p.query || p.name)}" target="_blank" rel="noopener noreferrer">지도 보기</a>
        <a href="${mapsUrl(p.query || p.name)}" target="_blank" rel="noopener noreferrer">가게 검색</a>
      </div>
      <div class="section">
        <h3>한줄 소개</h3>
        <p>${esc(p.summary)}</p>
      </div>
      <div class="section">
        <h3>가게 설명</h3>
        <p>${esc(p.detail)}</p>
      </div>
      <div class="section">
        <h3>대표 메뉴</h3>
        <div class="menu">${menusHtml}</div>
      </div>
      <div class="section">
        <h3>메모</h3>
        <div class="tiprow">${tipsHtml}</div>
      </div>
    </div>
  `;
  document.querySelectorAll(".card").forEach(card => {
    card.classList.toggle("selected", Number(card.dataset.index) === index);
  });
  if (mobileOpen && window.matchMedia("(max-width:980px)").matches) {
    panel.classList.add("open");
    backdrop.classList.add("show");
    document.body.style.overflow = "hidden";
  }
}
function closeMobile(){
  panel.classList.remove("open");
  backdrop.classList.remove("show");
  document.body.style.overflow = "";
}
document.getElementById("closemobile").onclick = closeMobile;
backdrop.onclick = closeMobile;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMobile(); });

function renderList(){
  renderTabs();
  const q = query.trim().toLowerCase();
  const items = places
    .map((p,i) => ({...p, _index:i}))
    .filter(p => filter === "전체" || p.area === filter)
    .filter(p => !q || (p.name + " " + p.category + " " + p.area + " " + p.summary + " " + p.detail + " " + p.menus.join(" ")).toLowerCase().includes(q))
    .sort((a,b) => b.rating - a.rating || a.name.localeCompare(b.name, "ko"));

  count.textContent = `${items.length}곳`;
  grid.innerHTML = items.map(p => `
    <article class="card ${p._index===currentIndex?'selected':''}" data-index="${p._index}">
      <div class="row">
        <div>
          <div class="name" data-open="${p._index}">${esc(p.name)}</div>
          <div class="tags"><span class="cat">${esc(p.category)}</span><span class="area">📍 ${esc(p.area)}</span></div>
        </div>
        <div class="score">⭐ ${Number(p.rating).toFixed(1)}</div>
      </div>
      <div class="summary">${esc(p.summary)}</div>
      <div class="actions">
        <button class="btn detailbtn" data-open="${p._index}">상세 정보</button>
        <a class="btn mapbtn" href="${mapsUrl(p.query || p.name)}" target="_blank" rel="noopener noreferrer">지도 보기</a>
      </div>
    </article>
  `).join("");
  document.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => showDetail(Number(el.dataset.open), true);
  });
}

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value;
  renderList();
});

renderList();
showDetail(0, false);
</script>
</body>
</html>
