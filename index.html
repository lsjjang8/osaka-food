<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>맹구 & 콩콩 오사카 맛집</title>
<meta name="theme-color" content="#fffaf7">
<style>
:root {
  --bg:#fffaf7;--panel:#fff;--text:#1f1b18;--muted:#746b65;--line:#ebe1da;
  --soft:#f7f1ed;--chip:#fff0f3;--chiptext:#a73b55;--shadow:0 12px 36px rgba(60,38,27,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
.app{max-width:1450px;margin:auto;display:grid;grid-template-columns:minmax(540px,1fr) 480px;gap:18px;padding:16px}
.left{min-width:0}
.hero{padding:18px 20px;background:linear-gradient(135deg,#fff,#fff0e7);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 6px;font-size:27px;letter-spacing:-.045em}
.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.controls{position:sticky;top:0;z-index:20;padding:10px 0 7px;background:rgba(255,250,247,.94);backdrop-filter:blur(12px)}
.search{width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
.tabs{display:flex;gap:7px;overflow:auto;padding-top:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:12px;white-space:nowrap;cursor:pointer}
.tab.active{background:#201c19;color:#fff;border-color:#201c19}
.meta{display:flex;justify-content:space-between;padding:6px 2px 9px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 3px 14px rgba(65,39,27,.04);transition:.16s}
.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(65,39,27,.07)}
.card.selected{border-color:#c9b4a7;box-shadow:0 0 0 2px #f0e5de}
.row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.name{font-size:17px;font-weight:850;line-height:1.35;letter-spacing:-.025em;cursor:pointer;text-decoration:underline;text-decoration-color:#ded0c8;text-underline-offset:4px}
.score{font-size:14px;font-weight:850;white-space:nowrap}
.tags{margin-top:7px}
.cat{display:inline-block;background:var(--chip);color:var(--chiptext);border-radius:999px;padding:5px 7px;font-size:11px;font-weight:700}
.area{font-size:11px;color:var(--muted);margin-left:5px}
.summary{font-size:13px;line-height:1.55;color:#4d4641;margin:11px 0 12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:10px 7px;font-size:12px;font-weight:800;text-decoration:none;cursor:pointer}
.detailbtn{background:var(--soft);color:#4c4039}
.mapbtn{background:#211d1a;color:#fff}

.rightwrap{position:relative}
.detailpanel{position:sticky;top:16px;height:calc(100vh - 32px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.maphero{height:210px;background:#eee;position:relative;border-radius:22px 22px 0 0;overflow:hidden}

.closemobile{display:none;position:absolute;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.94);font-size:22px;box-shadow:0 2px 9px rgba(0,0,0,.13)}
.detailbody{padding:20px}
.dtitle{font-size:25px;font-weight:900;line-height:1.25;letter-spacing:-.045em;margin:0 0 6px}
.dmeta{font-size:13px;color:#4f4742;line-height:1.5}
.dmeta b{color:#151210}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.quick a{border:1px solid var(--line);border-radius:999px;padding:9px 4px;text-align:center;text-decoration:none;color:#2c2724;font-size:12px;font-weight:800;background:#fff}
.quick a:first-child{background:#191715;color:#fff;border-color:#191715}
.fact{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.55}
.icon{width:22px;flex:none;text-align:center}
.facttext{min-width:0;word-break:break-word}
.section{padding:17px 0;border-top:1px solid var(--line)}
.section h3{margin:0 0 10px;font-size:17px;letter-spacing:-.025em}
.section p{margin:0;color:#47403b;font-size:13.5px;line-height:1.75}
.bullets{margin:0;padding-left:20px}
.bullets li{margin:0 0 8px;font-size:13.5px;line-height:1.6;color:#3f3935}
.bullets li:last-child{margin-bottom:0}
.menu{display:grid;gap:7px}
.menuitem{display:flex;justify-content:space-between;gap:10px;padding:10px 11px;border-radius:12px;background:#fffaf7;border:1px solid #f0e5de;font-size:13px}
.menuitem span:last-child{font-weight:800;color:#85583f;white-space:nowrap}
.emptydetail{height:100%;display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);text-align:center;line-height:1.6}
.mobilebackdrop{display:none}
.foot{color:var(--muted);font-size:11px;line-height:1.5;margin:13px 2px}

@media(max-width:980px){
 .app{display:block;padding:12px}
 .grid{grid-template-columns:1fr}
 .rightwrap{position:static}
 .detailpanel{position:fixed;z-index:101;inset:0 0 0 auto;width:min(520px,100%);height:100dvh;border-radius:0;transform:translateX(103%);transition:transform .22s ease;top:0}
 .detailpanel.open{transform:translateX(0)}
 .maphero{border-radius:0;height:220px}
 .closemobile{display:block}
 .mobilebackdrop{display:block;position:fixed;inset:0;z-index:100;background:rgba(20,15,12,.45);opacity:0;pointer-events:none;transition:.2s}
 .mobilebackdrop.show{opacity:1;pointer-events:auto}
}
@media(min-width:981px) and (max-width:1180px){
 .app{grid-template-columns:minmax(480px,1fr) 420px}
 .grid{grid-template-columns:1fr}
}

.static-hero{
 display:flex;align-items:flex-end;
 background:
   radial-gradient(circle at 20% 20%,rgba(255,255,255,.95) 0 7%,transparent 8%),
   linear-gradient(135deg,#f7e9df,#eadfd6 55%,#ded3cb);
}
.hero-place{
 margin:18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
 border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:12px 14px;
 display:flex;gap:10px;align-items:center;box-shadow:0 8px 25px rgba(65,39,27,.09)
}
.hero-pin{font-size:24px}
.hero-area{font-size:12px;color:#6f655f;font-weight:700}
.hero-cat{font-size:15px;font-weight:850;margin-top:2px}

</style>
</head>
<body>
<div class="app">
 <section class="left">
  <div class="hero">
   <h1>맹구 & 콩콩 오사카 맛집 🍓🥩</h1>

  </div>
  <div class="controls">
   <input id="search" class="search" placeholder="가게명 · 메뉴 · 지역 검색">

  <div class="meta"><span id="count"></span><span>★ Google 평점 높은 순</span></div>

 </section>

 <aside class="rightwrap">

  </div>
 </aside>
</div>
<div id="backdrop" class="mobilebackdrop"></div>

const areas=["전체","숙소 근처","우메다","혼마치·요도야바시","신사이바시"];
let filter="전체", q="", current=0;
const grid=document.getElementById("grid"), tabs=document.getElementById("tabs"), search=document.getElementById("search"), count=document.getElementById("count");
const panel=document.getElementById("detailpanel"), content=document.getElementById("detailcontent"), backdrop=document.getElementById("backdrop");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const maps=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const googleReviews=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const tel=p=>p.phone ? "tel:"+p.phone.replace(/\s/g,"") : maps(p.query);

function renderTabs(){
 tabs.innerHTML=areas.map(a=>`<button class="tab ${a===filter?'active':''}" data-a="${a}">${a}</button>`).join("");
 tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{filter=b.dataset.a;renderList()});
}

function showDetail(i, openMobile=true){
 current=i; const p=places[i];
 const menus=p.menus.map(m=>`<div class="menuitem"><span>${esc(m[0])}</span><span>${esc(m[1])}</span></div>`).join("");
 const bullets=p.highlights.map(x=>`<li>${esc(x)}</li>`).join("");
 content.innerHTML=`
   <div class="maphero static-hero">
    <div class="hero-place">
      <div class="hero-pin">📍</div>
      <div>
        <div class="hero-area">${esc(p.area)}</div>
        <div class="hero-cat">${esc(p.category)}</div>
      </div>
    </div>
   </div>
   <div class="detailbody">
    <h2 class="dtitle">${esc(p.name)}</h2>
    <div class="dmeta">⭐ <b>${p.rating.toFixed(1)}</b> · 리뷰 ${p.reviews.toLocaleString()}개 · ${esc(p.category)} · ${esc(p.price)}</div>
    <div class="quick">
      <a href="${maps(p.query)}" target="_blank" rel="noopener noreferrer">↗ 길찾기</a>
      <a href="${googleReviews(p.query)}" target="_blank" rel="noopener noreferrer">★ 리뷰</a>
      <a href="${tel(p)}">${p.phone?'☎ 전화':'⌕ 검색'}</a>
    </div>
    <div class="fact"><div class="icon">◷</div><div class="facttext">${esc(p.hours)}</div></div>
    <div class="fact"><div class="icon">⌖</div><div class="facttext">${esc(p.address)}</div></div>
    ${p.phone?`<div class="fact"><div class="icon">☎</div><div class="facttext">${esc(p.phone)}</div></div>`:""}
    <div class="section">
      <h3>가게 소개</h3>
      <p>${esc(p.description)}</p>
    </div>
    <div class="section">
      <h3>분위기와 평가</h3>
      <ul class="bullets">${bullets}</ul>
    </div>
    <div class="section">
      <h3>추천 메뉴</h3>
      <div class="menu">${menus}</div>
    </div>
   </div>`;
 document.querySelectorAll(".card").forEach(c=>c.classList.toggle("selected", Number(c.dataset.i)===i));
 if(openMobile && window.matchMedia("(max-width:980px)").matches){
   panel.classList.add("open"); backdrop.classList.add("show"); document.body.style.overflow="hidden";
 }
}

function closeMobile(){
 panel.classList.remove("open"); backdrop.classList.remove("show"); document.body.style.overflow="";
}
document.getElementById("closemobile").onclick=closeMobile;
backdrop.onclick=closeMobile;
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeMobile()});

function renderList(){
 renderTabs();
 const needle=q.trim().toLowerCase();
 let items=places.map((p,i)=>({...p,_i:i}))
  .filter(p=>filter==="전체"||p.area===filter)
  .filter(p=>!needle||(p.name+" "+p.category+" "+p.area+" "+p.summary+" "+p.description+" "+p.menus.flat().join(" ")).toLowerCase().includes(needle))
  .sort((a,b)=>b.rating-a.rating||a.name.localeCompare(b.name,"ko"));
 count.textContent=`${items.length}곳`;
 grid.innerHTML=items.map(p=>`
  <article class="card ${p._i===current?'selected':''}" data-i="${p._i}">
   <div class="row">
    <div>
     <div class="name" data-open="${p._i}">${esc(p.name)}</div>
     <div class="tags"><span class="cat">${esc(p.category)}</span><span class="area">📍 ${esc(p.area)}</span></div>
    </div>
    <div class="score">⭐ ${p.rating.toFixed(1)}</div>
   </div>
   <div class="summary">${esc(p.summary)}</div>
   <div class="actions">
    <button class="btn detailbtn" data-open="${p._i}">상세 정보</button>
    <a class="btn mapbtn" href="${maps(p.query)}" target="_blank" rel="noopener noreferrer">지도 보기</a>
   </div>
  </article>`).join("");
